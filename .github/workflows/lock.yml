name: Lockfile

# One-off helper for upstream merges: resolves windows/Cargo.lock against the
# manifests (adds what is missing, keeps every pin) and uploads the result.
# Nothing is built or published.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo metadata --manifest-path windows/Cargo.toml --format-version 1 > /dev/null
      - uses: actions/upload-artifact@v7
        with:
          name: Cargo.lock
          path: windows/Cargo.lock
